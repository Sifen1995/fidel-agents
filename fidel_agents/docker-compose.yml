services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fidel-academy-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-fidel_academy}
      DB_USERNAME: ${DB_USERNAME:-fidel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11435}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-proxy:
        condition: service_started
    networks:
      - fidel-academy

  ollama-proxy:
    image: alpine/socat
    container_name: fidel-academy-ollama-proxy
    restart: unless-stopped
    network_mode: host
    command: tcp-listen:11435,reuseaddr,fork tcp:127.0.0.1:11434

  postgres:
    image: ankane/pgvector:latest
    container_name: fidel-academy-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fidel_academy}
      POSTGRES_USER: ${DB_USERNAME:-fidel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fidel} -d ${DB_DATABASE:-fidel_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fidel-academy

  redis:
    image: redis:7-alpine
    container_name: fidel-academy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fidel-academy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fidel-academy-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fidel-academy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  fidel-academy:
    driver: bridge
